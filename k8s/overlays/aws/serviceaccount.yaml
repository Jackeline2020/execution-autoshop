apiVersion: v1
kind: ServiceAccount
metadata:
  name: autoshop-execution
  namespace: autoshop
  annotations:
    # Role IAM própria do serviço (IRSA), criada pelo infra-k8s-autoshop;
    # substituída pelo pipeline a partir do secret IRSA_ROLE_ARN
    eks.amazonaws.com/role-arn: "IRSA_ROLE_ARN_PLACEHOLDER"
