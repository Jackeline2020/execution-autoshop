name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

env:
  IMAGE_NAME: autoshop-execution

jobs:
  # Build, testes unitários e de integração (DynamoDB e SQS no LocalStack),
  # cobertura mínima de 80% e análise do SonarCloud
  test:
    name: Build + Testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Baixar dependências
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Análise estática (go vet)
        run: go vet ./...

      - name: Subir LocalStack (tabelas e filas do serviço)
        run: |
          docker compose up -d localstack
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q localstack)")
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          docker compose logs localstack
          exit 1

      - name: Testes unitários e de integração com cobertura
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Verificar cobertura mínima (80%)
        run: ./scripts/coverage.sh

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Build da imagem Docker e publicação no GitHub Container Registry
  build-and-push:
    name: Build da Imagem Docker
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.full }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir nome da imagem (minúsculo, exigido pelo registry)
        id: image
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "full=ghcr.io/${OWNER_LOWER}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Login no GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.full }}
